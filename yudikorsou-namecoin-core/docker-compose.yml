version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: yudikorsou-namecoin-core_web_1
      APP_PORT: 3000

  namecoind:
    image: ghcr.io/yudikorsou/namecoin-core:31.1
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 15m30s
    volumes:
      - ${APP_DATA_DIR}/data/namecoin:/data
    ports:
      - "8334:8334" # P2P
      - "8336:8336" # JSON-RPC (LAN only, see namecoin.conf rpcallowip)

  web:
    image: ghcr.io/yudikorsou/namecoin-core-ui:1.0.0
    user: "1000:1000"
    restart: on-failure
    depends_on:
      - namecoind
    environment:
      RPC_HOST: namecoind
      RPC_PORT: "8336"
      NAMECOIN_DATA: /data
    volumes:
      - ${APP_DATA_DIR}/data/namecoin:/data:ro
