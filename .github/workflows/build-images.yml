name: Build images

# Builds multi-arch (amd64 + arm64) images and pushes them to GHCR:
#   ghcr.io/<owner>/namecoin-core:<NC_VERSION>
#   ghcr.io/<owner>/namecoin-core-ui:<UI_VERSION>
# Runs manually (Actions tab -> Build images -> Run workflow) or on a v* tag.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: namecoin-core,    context: docker/namecoind, platform: linux/amd64, runner: ubuntu-24.04 }
          - { image: namecoin-core,    context: docker/namecoind, platform: linux/arm64, runner: ubuntu-24.04-arm }
          - { image: namecoin-core-ui, context: docker/ui,        platform: linux/amd64, runner: ubuntu-24.04 }
          - { image: namecoin-core-ui, context: docker/ui,        platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Set names
        id: n
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "repo=ghcr.io/${owner}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          echo "arch=$(echo '${{ matrix.platform }}' | cut -d/ -f2)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.n.outputs.repo }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ steps.n.outputs.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ steps.n.outputs.arch }}

      - name: Save digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ steps.n.outputs.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ steps.n.outputs.arch }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { image: namecoin-core,    tag: "31.1" }
          - { image: namecoin-core-ui, tag: "1.0.0" }
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.image }}-*
          path: /tmp/digests
          merge-multiple: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch tags
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo="ghcr.io/${owner}/${{ matrix.image }}"
          refs=""
          for f in /tmp/digests/*/*; do refs="$refs ${repo}@$(cat "$f")"; done
          docker buildx imagetools create -t "${repo}:${{ matrix.tag }}" -t "${repo}:latest" $refs
          docker buildx imagetools inspect "${repo}:${{ matrix.tag }}"
